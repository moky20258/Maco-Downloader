name: 'Tauri Build'

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

# 防止重复触发：同一分支的多次推送会取消之前的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 测试job - 用于验证CI/CD是否正常工作
  test-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Test trigger
        run: |
          echo "✅ CI/CD is working!"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"


  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            rust_target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: 'x86_64-unknown-linux-gnu'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file openssl libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev gnome-video-effects gnome-video-effects-extra
          # Install vcpkg for Tauri dependencies
          export VCPKG_ROOT=/usr/local/share/vcpkg
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
            $VCPKG_ROOT/bootstrap-vcpkg.sh
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Get version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          # 从 tauri.conf.json 读取版本号
          if command -v jq &> /dev/null; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          else
            VERSION=$(grep -o '"version": *"[^"]*"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\([^"]*\)"/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version from tauri.conf.json: $VERSION"

      - name: Update version from tag (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # 如果是 tag 推送，使用 tag 版本号覆盖
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Tag push detected, updating version to: $VERSION"
          
          # 更新 tauri.conf.json
          if command -v jq &> /dev/null; then
            jq ".version = \"$VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          fi
          
          # 更新 package.json
          if command -v jq &> /dev/null; then
            jq ".version = \"$VERSION\"" package.json > tmp.json && mv tmp.json package.json
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          fi
          
          echo "Version updated to: $VERSION"

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          projectPath: '.'
          appName: maco-music
          # 禁用 tauri-action 自动创建 Release，由后面的 job 统一处理
          releaseBody: ''
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage

  create-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    # tag 推送或 main/master 分支推送时都创建 Release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get_version
        shell: bash
        run: |
          if command -v jq &> /dev/null; then
            VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          else
            VERSION=$(grep -o '"version": *"[^"]*"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"\([^"]*\)"/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
          # 如果 tag 已存在，则更新 Release 而不是失败
          allowUpdates: true
          updateOnlyUnreleased: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
